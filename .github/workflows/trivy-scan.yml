# Trivy vulnerability scanning workflow (2025 version)
# https://github.com/aquasecurity/trivy-action
# NOTE: Temporary setup. Existing workflows (pr.yaml, push.yaml) are kept

name: Security Scan with Trivy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  # ====================
  # Repository Scan (dependency vulnerabilities)
  # ====================
  repo-scan:
    name: Repository Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run Trivy vulnerability scanner (filesystem mode)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: "fs"
          scan-ref: "."
          trivy-config: trivy.yaml
          format: "sarif"
          output: "trivy-repo-results.sarif"
          # Use vuln scanner only (others are separated into different jobs)
          scanners: "vuln"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: "trivy-repo-results.sarif"
          category: "trivy-repo"

  # ====================
  # IaC Scan (Dockerfile, Kubernetes)
  # ====================
  iac-scan:
    name: IaC Configuration Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run Trivy scanner (config mode)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: "config"
          scan-ref: "."
          trivy-config: trivy.yaml
          format: "sarif"
          output: "trivy-iac-results.sarif"
          # Use misconfig scanner only
          scanners: "misconfig"

      - name: Upload Trivy IaC scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: "trivy-iac-results.sarif"
          category: "trivy-iac"

  # ====================
  # Secret Scan
  # ====================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0  # Fetch full history to detect secrets

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: "fs"
          scan-ref: "."
          trivy-config: trivy.yaml
          format: "sarif"
          output: "trivy-secret-results.sarif"
          scanners: "secret"

      - name: Upload Trivy secret scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: "trivy-secret-results.sarif"
          category: "trivy-secret"

  # ====================
  # Container Image Build and Scan
  # ====================
  container-scan:
    name: Build and Scan Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Build local image for scanning
        run: docker build --tag security-pr-scan:local .
      - name: Scan local container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: security-pr-scan:local
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-image-results.sarif
          scanners: vuln
      - name: Upload Trivy container scan results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-container

  # ====================
  # SBOM Generation
  # ====================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: "fs"
          scan-ref: "."
          trivy-config: trivy.yaml
          format: "cyclonedx"
          output: "sbom.json"

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 30
